(function () {
  const nodeMap = new Map(DATA.nodes.map(n => [n.id, n]));
  const pillarMap = new Map(DATA.pillars.map(p => [p.id, p]));
  const lectureMap = new Map(DATA.lectures.map(l => [l.id, l]));
  const childrenMap = new Map();
  DATA.nodes.forEach(n => {
    if (!childrenMap.has(n.id)) childrenMap.set(n.id, []);
    if (n.parentId) {
      if (!childrenMap.has(n.parentId)) childrenMap.set(n.parentId, []);
      childrenMap.get(n.parentId).push(n);
    }
  });

  // State — defaults to Overview (Level 2 clusters collapsed) & Cross-Links ON
  let layoutMode = 'tree'; // 'tree' | 'radial'
  let collapsed = new Set(DATA.nodes.filter(n => n.level === 2).map(n => n.id));
  let selectedId = null;
  let selectedLinkKey = null;
  let hoveredNodeId = null;
  let activeLectureId = '';
  let showAllCrossLinks = true;
  let posMap = new Map(); // id -> {x, y, side, angle, w, h}
  let transform = { x: 0, y: 0, k: 0.78 };

  // DOM refs
  const svg = document.getElementById('mindmap');
  const stage = document.getElementById('stage');
  const viewport = document.getElementById('viewport');
  const layerCross = document.getElementById('layer-cross');
  const layerEdges = document.getElementById('layer-edges');
  const layerNodes = document.getElementById('layer-nodes');
  const drawer = document.getElementById('drawer');
  const tooltip = document.getElementById('linkTooltip');
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  const searchResults = document.getElementById('searchResults');
  const lectureFilter = document.getElementById('lectureFilter');
  const filterBanner = document.getElementById('filterBanner');
  const filterBannerText = document.getElementById('filterBannerText');
  const btnOverview = document.getElementById('btnOverview');
  const btnExpandAll = document.getElementById('btnExpandAll');

  // Stats
  const l3Count = DATA.nodes.filter(n => n.level === 3).length;
  document.getElementById('courseTitle').textContent = DATA.course;
  document.getElementById('courseStats').textContent =
    `${DATA.lectures.length} classes · ${DATA.pillars.length} pillars · ${l3Count} topics`;

  // Populate Lecture Filter
  DATA.lectures.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.id;
    opt.textContent = `${l.id}: ${l.title}`;
    lectureFilter.appendChild(opt);
  });

  // Populate Pillar Legend
  const legendEl = document.getElementById('pillarLegend');
  DATA.pillars.forEach(p => {
    const chip = document.createElement('span');
    chip.className = 'legend-chip';
    chip.innerHTML = `<span class="legend-dot" style="background:${p.color}"></span>${p.shortTitle}`;
    chip.title = p.title;
    chip.addEventListener('click', () => {
      collapsed.delete(p.id);
      syncDepthButtons();
      render();
      selectNode(p.id, true);
    });
    legendEl.appendChild(chip);
  });

  function syncDepthButtons() {
    const l2Ids = DATA.nodes.filter(n => n.level === 2).map(n => n.id);
    const allL2Collapsed = l2Ids.every(id => collapsed.has(id)) && !DATA.pillars.some(p => collapsed.has(p.id));
    const allExpanded = collapsed.size === 0;
    btnOverview.classList.toggle('active', allL2Collapsed);
    btnExpandAll.classList.toggle('active', allExpanded);
  }

  function getColor(n) {
    if (!n || n.level === 0) return '#0f172a';
    const p = pillarMap.get(n.pillar);
    return p ? p.color : '#4f46e5';
  }

  function visibleChildren(id) {
    if (collapsed.has(id)) return [];
    return childrenMap.get(id) || [];
  }

  // Nearest visible ancestor (or self if currently rendered)
  function visibleRep(id) {
    let cur = nodeMap.get(id);
    while (cur) {
      if (posMap.has(cur.id)) return cur.id;
      cur = cur.parentId ? nodeMap.get(cur.parentId) : null;
    }
    return null;
  }

  function estimateBox(n) {
    const charW = n.level === 0 ? 9.2 : n.level === 1 ? 7.6 : n.level === 2 ? 6.9 : 6.2;
    const padX = n.level === 0 ? 34 : n.level === 1 ? 26 : n.level === 2 ? 22 : 18;
    const h = n.level === 0 ? 48 : n.level === 1 ? 36 : n.level === 2 ? 30 : 25;
    const w = Math.max(96, Math.min(340, Math.round(n.title.length * charW + padX)));
    return { w, h };
  }

  // =========================================================================
  // LAYOUT 1: Bilateral Horizontal Mind Map
  // =========================================================================
  function computeBilateralLayout() {
    posMap.clear();
    const root = nodeMap.get('root');
    const rootBox = estimateBox(root);
    posMap.set('root', { x: 0, y: 0, side: 0, ...rootBox });

    const leftPillars = ['p1', 'p2', 'p3'].map(id => nodeMap.get(id)).filter(Boolean);
    const rightPillars = ['p4', 'p5', 'p6'].map(id => nodeMap.get(id)).filter(Boolean);

    const LEVEL_X = { 1: 270, 2: 600, 3: 940 };
    const LEAF_GAP = 32;
    const CLUSTER_GAP = 16;
    const PILLAR_GAP = 28;

    function subtreeHeight(n) {
      const kids = visibleChildren(n.id);
      if (kids.length === 0) return n.level === 2 ? 42 : LEAF_GAP;
      let total = 0;
      kids.forEach((k, idx) => {
        total += subtreeHeight(k);
        if (idx < kids.length - 1 && n.level === 1) total += CLUSTER_GAP;
      });
      return Math.max(LEAF_GAP, total);
    }

    function layoutSide(pillars, dir) {
      const heights = pillars.map(p => subtreeHeight(p));
      const totalH = heights.reduce((a, b) => a + b, 0) + PILLAR_GAP * Math.max(0, pillars.length - 1);
      let cursorY = -totalH / 2;

      function place(n, topY, spanH) {
        const box = estimateBox(n);
        const cy = topY + spanH / 2;
        const cx = dir * LEVEL_X[n.level];
        posMap.set(n.id, { x: cx, y: cy, side: dir, ...box });

        const kids = visibleChildren(n.id);
        if (!kids.length) return;
        const gap = n.level === 1 ? CLUSTER_GAP : 0;
        const kidHeights = kids.map(k => subtreeHeight(k));
        const usedH = kidHeights.reduce((a, b) => a + b, 0) + gap * Math.max(0, kids.length - 1);
        let y0 = cy - usedH / 2;
        kids.forEach((k, i) => {
          place(k, y0, kidHeights[i]);
          y0 += kidHeights[i] + gap;
        });
      }

      pillars.forEach((p, i) => {
        place(p, cursorY, heights[i]);
        cursorY += heights[i] + PILLAR_GAP;
      });
    }

    layoutSide(leftPillars, -1);
    layoutSide(rightPillars, 1);
  }

  // =========================================================================
  // LAYOUT 2: 360° Radial Mind Map
  // =========================================================================
  function computeRadialLayout() {
    posMap.clear();
    const root = nodeMap.get('root');
    const rootBox = estimateBox(root);
    posMap.set('root', { x: 0, y: 0, side: 0, angle: 0, ...rootBox });

    function leafCount(n) {
      const kids = visibleChildren(n.id);
      if (!kids.length) return 1;
      return kids.reduce((s, k) => s + leafCount(k), 0);
    }

    const pillars = visibleChildren('root');
    const totalLeaves = pillars.reduce((s, p) => s + leafCount(p), 0);
    const hasL3 = Array.from(DATA.nodes).some(n => n.level === 2 && !collapsed.has(n.id));
    const R = hasL3 ? { 1: 260, 2: 530, 3: 850 } : { 1: 230, 2: 470, 3: 740 };

    let curAngle = -Math.PI / 2;
    function placeRadial(n, aStart, aSpan) {
      const mid = aStart + aSpan / 2;
      const r = R[n.level];
      const x = r * Math.cos(mid);
      const y = r * Math.sin(mid);
      const box = estimateBox(n);
      const side = Math.cos(mid) >= 0 ? 1 : -1;
      posMap.set(n.id, { x, y, side, angle: mid, ...box });

      const kids = visibleChildren(n.id);
      if (!kids.length) return;
      const subLeaves = kids.reduce((s, k) => s + leafCount(k), 0);
      let a = aStart;
      kids.forEach(k => {
        const span = aSpan * (leafCount(k) / subLeaves);
        placeRadial(k, a, span);
        a += span;
      });
    }

    pillars.forEach(p => {
      const span = (2 * Math.PI) * (leafCount(p) / Math.max(1, totalLeaves));
      placeRadial(p, curAngle, span);
      curAngle += span;
    });
  }

  function svgEl(tag, attrs = {}) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  }

  function nodeMatchesLecture(n, lecId) {
    if (!lecId) return true;
    if (n.level === 0) return true;
    return n.lectures && n.lectures.some(x => x.id === lecId);
  }

  function getHighlightedIds() {
    if (!activeLectureId) return null;
    const set = new Set(['root']);
    DATA.nodes.forEach(n => {
      if (n.level > 0 && nodeMatchesLecture(n, activeLectureId)) {
        let cur = n;
        while (cur) {
          set.add(cur.id);
          cur = cur.parentId ? nodeMap.get(cur.parentId) : null;
        }
      }
    });
    return set;
  }

  // Build visible cross-links (aggregating collapsed children up to visible clusters/pillars!)
  function collectVisibleCrossLinks() {
    const agg = new Map(); // "idA--idB" -> { a, b, pairs: [{src, dst}] }
    const seenRaw = new Set();

    DATA.nodes.forEach(src => {
      if (!src.relatedIds || !src.relatedIds.length) return;
      src.relatedIds.forEach(dstId => {
        const rawKey = [src.id, dstId].sort().join('||');
        if (seenRaw.has(rawKey)) return;
        seenRaw.add(rawKey);

        const repA = visibleRep(src.id);
        const repB = visibleRep(dstId);
        if (!repA || !repB || repA === repB || repA === 'root' || repB === 'root') return;
        // Skip trivial parent/child links
        const nA = nodeMap.get(repA), nB = nodeMap.get(repB);
        if (nA.parentId === repB || nB.parentId === repA) return;

        const key = [repA, repB].sort().join('--');
        if (!agg.has(key)) agg.set(key, { key, a: repA, b: repB, pairs: [] });
        agg.get(key).pairs.push({ src: src.id, dst: dstId });
      });
    });

    return Array.from(agg.values());
  }

  function showTooltip(e, html) {
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    moveTooltip(e);
  }
  function moveTooltip(e) {
    const pad = 14;
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    const r = tooltip.getBoundingClientRect();
    if (x + r.width > window.innerWidth - 10) x = e.clientX - r.width - pad;
    if (y + r.height > window.innerHeight - 10) y = e.clientY - r.height - pad;
    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${y}px`;
  }
  function hideTooltip() {
    tooltip.style.display = 'none';
  }

  function highlightEndpoints(idA, idB, on) {
    [idA, idB].forEach(id => {
      const el = layerNodes.querySelector(`[data-id="${id}"]`);
      if (el) el.classList.toggle('link-endpoint', on);
    });
  }

  function updateCrossLinkFocus() {
    const focusId = hoveredNodeId || selectedId;
    layerCross.querySelectorAll('.cross-group').forEach(g => {
      const a = g.getAttribute('data-a');
      const b = g.getAttribute('data-b');
      const key = g.getAttribute('data-key');
      const isFocused = (selectedLinkKey && key === selectedLinkKey) || (focusId && (a === focusId || b === focusId));
      g.classList.toggle('highlighted', !!isFocused);
      g.classList.toggle('dimmed', !!(focusId && !isFocused && showAllCrossLinks));
      if (!showAllCrossLinks) {
        g.style.display = isFocused ? '' : 'none';
      } else {
        g.style.display = '';
      }
    });
  }

  function render() {
    if (layoutMode === 'tree') computeBilateralLayout();
    else computeRadialLayout();

    layerCross.innerHTML = '';
    layerEdges.innerHTML = '';
    layerNodes.innerHTML = '';

    const hiSet = getHighlightedIds();
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

    // 1. Hierarchical Edges
    posMap.forEach((pos, id) => {
      const n = nodeMap.get(id);
      if (!n.parentId || !posMap.has(n.parentId)) return;
      const pPos = posMap.get(n.parentId);
      const color = getColor(n);
      const strokeW = n.level === 1 ? 3.2 : n.level === 2 ? 2.1 : 1.35;

      let d;
      if (layoutMode === 'tree') {
        const dir = pos.side;
        const x1 = pPos.x + dir * (pPos.w / 2);
        const y1 = pPos.y;
        const x2 = pos.x - dir * (pos.w / 2);
        const y2 = pos.y;
        const mx = (x1 + x2) / 2;
        d = `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
      } else {
        const mx = (pPos.x + pos.x) * 0.45;
        const my = (pPos.y + pos.y) * 0.45;
        d = `M ${pPos.x} ${pPos.y} Q ${mx} ${my}, ${pos.x} ${pos.y}`;
      }

      const dimmed = hiSet && (!hiSet.has(id) || !hiSet.has(n.parentId));
      layerEdges.appendChild(svgEl('path', {
        d,
        class: 'edge' + (dimmed ? ' dimmed' : ''),
        stroke: color,
        'stroke-width': strokeW,
        'stroke-opacity': n.level === 3 ? '0.45' : '0.72',
      }));
    });

    // 2. Interactive Cross-Links (visible in BOTH Overview and Expanded modes!)
    const crossLinks = collectVisibleCrossLinks();
    crossLinks.forEach(link => {
      const p1 = posMap.get(link.a);
      const p2 = posMap.get(link.b);
      if (!p1 || !p2) return;
      const nA = nodeMap.get(link.a);
      const nB = nodeMap.get(link.b);

      // Compute graceful curve that bows gently away from center / straight chord
      let cx, cy;
      if (layoutMode === 'tree') {
        const sameSide = p1.side === p2.side;
        if (sameSide) {
          const bow = p1.side * (85 + Math.min(180, Math.abs(p1.y - p2.y) * 0.28));
          cx = (p1.x + p2.x) / 2 + bow;
          cy = (p1.y + p2.y) / 2;
        } else {
          // Crosses left <-> right: gentle vertical arc around root
          cx = (p1.x + p2.x) / 2;
          cy = (p1.y + p2.y) / 2 + ((p1.y + p2.y) >= 0 ? 75 : -75);
        }
      } else {
        cx = (p1.x + p2.x) * 0.25;
        cy = (p1.y + p2.y) * 0.25;
      }

      const d = `M ${p1.x} ${p1.y} Q ${cx} ${cy}, ${p2.x} ${p2.y}`;
      const baseColor = getColor(nA);
      const count = link.pairs.length;
      const baseW = Math.min(2.8, 1.35 + Math.log2(count) * 0.55);
      const baseOp = isDark ? 0.42 : 0.36;

      const cg = svgEl('g', {
        class: 'cross-group',
        'data-a': link.a,
        'data-b': link.b,
        'data-key': link.key,
      });

      // Invisible wide hit target for easy mouse clicking/hovering
      const hit = svgEl('path', { d, class: 'cross-hit' });
      const vis = svgEl('path', {
        d,
        class: 'cross-edge',
        stroke: baseColor,
        'stroke-width': baseW,
        'stroke-opacity': baseOp,
      });
      cg.appendChild(vis);
      cg.appendChild(hit);

      // Midpoint count pill when aggregated (count > 1) in Overview
      if (count > 1 && (nA.level < 3 || nB.level < 3)) {
        const mx = 0.25 * p1.x + 0.5 * cx + 0.25 * p2.x;
        const my = 0.25 * p1.y + 0.5 * cy + 0.25 * p2.y;
        const bg = svgEl('g', { class: 'cross-badge', transform: `translate(${mx}, ${my})` });
        bg.appendChild(svgEl('circle', {
          r: 8.5,
          fill: isDark ? '#1e293b' : '#ffffff',
          stroke: baseColor,
          'stroke-width': 1.2,
          'fill-opacity': 0.92,
        }));
        const bt = svgEl('text', {
          x: 0, y: 0.5, 'text-anchor': 'middle', 'dominant-baseline': 'central',
          fill: baseColor, 'font-size': 9.5, 'font-weight': '700',
        });
        bt.textContent = count;
        bg.appendChild(bt);
        cg.appendChild(bg);
      }

      // Mouse interaction on link
      cg.addEventListener('mouseenter', (e) => {
        cg.classList.add('highlighted');
        highlightEndpoints(link.a, link.b, true);
        const preview = link.pairs.slice(0, 3).map(pr =>
          `${nodeMap.get(pr.src).title} ↔ ${nodeMap.get(pr.dst).title}`
        ).join('<br>');
        const more = count > 3 ? `<br><em>+${count - 3} more — click to inspect</em>` : '<br><em>Click link to inspect & jump</em>';
        showTooltip(e, `
          <div class="link-tooltip-title">
            <span class="legend-dot" style="background:${getColor(nA)}"></span>
            <span>${nA.title}</span>
            <span>↔</span>
            <span class="legend-dot" style="background:${getColor(nB)}"></span>
            <span>${nB.title}</span>
          </div>
          <div class="link-tooltip-sub">${count === 1 ? 'Conceptual link — click to inspect' : `${count} linked concepts:<br>${preview}${more}`}</div>
        `);
      });
      cg.addEventListener('mousemove', moveTooltip);
      cg.addEventListener('mouseleave', () => {
        highlightEndpoints(link.a, link.b, false);
        hideTooltip();
        updateCrossLinkFocus();
      });
      cg.addEventListener('click', (e) => {
        e.stopPropagation();
        hideTooltip();
        inspectCrossLink(link);
      });

      layerCross.appendChild(cg);
    });

    // 3. Nodes
    posMap.forEach((pos, id) => {
      const n = nodeMap.get(id);
      const color = getColor(n);
      const kids = childrenMap.get(id) || [];
      const hasKids = kids.length > 0;
      const isCollapsed = collapsed.has(id);
      const isSelected = id === selectedId;
      const dimmed = hiSet && !hiSet.has(id);

      const g = svgEl('g', {
        class: `node-group${isSelected ? ' selected' : ''}${dimmed ? ' dimmed' : ''}`,
        transform: `translate(${pos.x}, ${pos.y})`,
        'data-id': id,
      });

      const rx = n.level === 0 ? 14 : n.level === 1 ? 10 : n.level === 2 ? 8 : 6;
      let fill, stroke, textColor, strokeW;

      if (n.level === 0) {
        fill = isDark ? '#f8fafc' : '#0f172a';
        stroke = fill;
        textColor = isDark ? '#0f172a' : '#ffffff';
        strokeW = 2;
      } else if (n.level === 1) {
        fill = color;
        stroke = color;
        textColor = '#ffffff';
        strokeW = 1.5;
      } else if (n.level === 2) {
        fill = isDark ? '#1e293b' : '#ffffff';
        stroke = color;
        textColor = isDark ? '#f8fafc' : '#0f172a';
        strokeW = 1.9;
      } else {
        fill = isDark ? '#172033' : '#ffffff';
        stroke = isSelected ? color : (isDark ? '#334155' : '#cbd5e1');
        textColor = isDark ? '#e2e8f0' : '#1e293b';
        strokeW = isSelected ? 2.4 : 1.1;
      }

      g.appendChild(svgEl('rect', {
        class: 'node-box',
        x: -pos.w / 2, y: -pos.h / 2, width: pos.w, height: pos.h,
        rx, fill, stroke, 'stroke-width': strokeW,
      }));

      if (n.level === 3) {
        g.appendChild(svgEl('rect', {
          x: -pos.w / 2, y: -pos.h / 2, width: 4.5, height: pos.h, rx: 2, fill: color,
        }));
      }

      const fontSize = n.level === 0 ? 14.5 : n.level === 1 ? 12.5 : n.level === 2 ? 11.5 : 10.5;
      const fontWeight = n.level <= 1 ? '700' : n.level === 2 ? '650' : '500';
      const label = svgEl('text', {
        class: 'node-label',
        x: n.level === 3 ? 2 : 0, y: 0,
        'text-anchor': 'middle', 'dominant-baseline': 'central',
        fill: textColor, 'font-size': fontSize, 'font-weight': fontWeight,
      });
      label.textContent = n.title;
      g.appendChild(label);

      // Expand/Collapse badge showing child count when collapsed
      if (hasKids && n.level > 0) {
        const dir = pos.side || 1;
        const bx = layoutMode === 'tree' ? dir * (pos.w / 2 + 12) : Math.cos(pos.angle) * (pos.w / 2 + 11);
        const by = layoutMode === 'tree' ? 0 : Math.sin(pos.angle) * (pos.h / 2 + 11);
        const tg = svgEl('g', { class: 'toggle-btn', transform: `translate(${bx}, ${by})` });
        tg.appendChild(svgEl('circle', {
          r: isCollapsed ? 10 : 8,
          fill: isCollapsed ? color : (isDark ? '#0f172a' : '#ffffff'),
          stroke: color,
          'stroke-width': 1.5,
        }));
        const txt = svgEl('text', {
          x: 0, y: 0.5, 'text-anchor': 'middle', 'dominant-baseline': 'central',
          fill: isCollapsed ? '#ffffff' : color,
          'font-size': isCollapsed ? 9.5 : 11, 'font-weight': '700', 'pointer-events': 'none',
        });
        txt.textContent = isCollapsed ? `+${kids.length}` : '−';
        tg.appendChild(txt);
        tg.addEventListener('click', (e) => {
          e.stopPropagation();
          if (collapsed.has(id)) collapsed.delete(id);
          else collapsed.add(id);
          syncDepthButtons();
          render();
        });
        g.appendChild(tg);
      }

      g.addEventListener('mouseenter', () => {
        hoveredNodeId = id;
        updateCrossLinkFocus();
      });
      g.addEventListener('mouseleave', () => {
        hoveredNodeId = null;
        updateCrossLinkFocus();
      });
      g.addEventListener('click', (e) => {
        e.stopPropagation();
        selectNode(id, false);
      });
      g.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        if (hasKids && n.level > 0) {
          if (collapsed.has(id)) collapsed.delete(id);
          else collapsed.add(id);
          syncDepthButtons();
          render();
        }
      });

      layerNodes.appendChild(g);
    });

    updateCrossLinkFocus();
    applyTransform();
  }

  function inspectCrossLink(link) {
    selectedId = null;
    selectedLinkKey = link.key;
    const nA = nodeMap.get(link.a);
    const nB = nodeMap.get(link.b);

    const bcEl = document.getElementById('drawerBreadcrumb');
    bcEl.innerHTML = '<span>Conceptual Cross-Link</span>';

    document.getElementById('drawerTitle').textContent = `${nA.title} ↔ ${nB.title}`;
    document.getElementById('drawerTitle').style.color = '';
    document.getElementById('drawerSummary').textContent =
      link.pairs.length === 1
        ? `Direct conceptual connection between these two topics across the course. Click either topic below to inspect its summary and lecture reference.`
        : `${link.pairs.length} fine-grained concepts link "${nA.title}" and "${nB.title}". Click any concept below to expand its branch and inspect it.`;

    document.getElementById('drawerFormulaWrap').style.display = 'none';
    document.getElementById('drawerLecturesWrap').style.display = 'none';
    document.getElementById('drawerRelatedWrap').style.display = 'none';
    document.getElementById('drawerChildrenWrap').style.display = 'none';
    document.getElementById('drawerTagsWrap').style.display = 'none';

    const pairsWrap = document.getElementById('drawerPairsWrap');
    const pairsEl = document.getElementById('drawerPairs');
    pairsWrap.style.display = 'block';
    pairsEl.innerHTML = '';

    link.pairs.forEach(pr => {
      const s = nodeMap.get(pr.src);
      const d = nodeMap.get(pr.dst);
      const card = document.createElement('div');
      card.className = 'pair-card';
      card.innerHTML = `
        <div class="pair-row">
          <button class="pair-btn" data-jump="${s.id}"><span class="legend-dot" style="background:${getColor(s)}"></span>${s.title}</button>
          <span style="color:var(--text-subtle)">↔</span>
          <button class="pair-btn" data-jump="${d.id}"><span class="legend-dot" style="background:${getColor(d)}"></span>${d.title}</button>
        </div>
      `;
      card.querySelectorAll('[data-jump]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          selectNode(btn.getAttribute('data-jump'), true);
        });
      });
      pairsEl.appendChild(card);
    });

    drawer.classList.add('open');
    updateCrossLinkFocus();
  }

  function applyTransform() {
    viewport.setAttribute('transform', `translate(${transform.x}, ${transform.y}) scale(${transform.k})`);
  }

  function fitToScreen() {
    if (!posMap.size) return;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    posMap.forEach(p => {
      minX = Math.min(minX, p.x - p.w / 2 - 40);
      maxX = Math.max(maxX, p.x + p.w / 2 + 40);
      minY = Math.min(minY, p.y - p.h / 2 - 40);
      maxY = Math.max(maxY, p.y + p.h / 2 + 40);
    });
    const rect = stage.getBoundingClientRect();
    const drawerOffset = drawer.classList.contains('open') ? 190 : 0;
    const availW = Math.max(300, rect.width - drawerOffset - 40);
    const availH = Math.max(300, rect.height - 70);
    const k = Math.min(1.15, Math.min(availW / (maxX - minX), availH / (maxY - minY)));
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    transform.k = k;
    transform.x = (rect.width - drawerOffset) / 2 - cx * k;
    transform.y = rect.height / 2 - cy * k;
    applyTransform();
  }

  function centerOnNode(id) {
    let cur = nodeMap.get(id);
    let changed = false;
    while (cur && cur.parentId) {
      if (collapsed.has(cur.parentId)) {
        collapsed.delete(cur.parentId);
        changed = true;
      }
      cur = nodeMap.get(cur.parentId);
    }
    if (changed) { syncDepthButtons(); render(); }
    const p = posMap.get(id);
    if (!p) return;
    const rect = stage.getBoundingClientRect();
    const drawerW = drawer.classList.contains('open') ? 390 : 0;
    const targetK = Math.max(transform.k, 0.88);
    transform.k = targetK;
    transform.x = (rect.width - drawerW) / 2 - p.x * targetK;
    transform.y = rect.height / 2 - p.y * targetK;
    applyTransform();
  }

  function selectNode(id, shouldCenter = false) {
    selectedId = id;
    selectedLinkKey = null;
    const n = nodeMap.get(id);
    if (!n) return;

    document.getElementById('drawerPairsWrap').style.display = 'none';
    document.getElementById('drawerLecturesWrap').style.display = 'block';

    // Breadcrumb
    const crumbs = [];
    let cur = n;
    while (cur) {
      crumbs.unshift(cur);
      cur = cur.parentId ? nodeMap.get(cur.parentId) : null;
    }
    const bcEl = document.getElementById('drawerBreadcrumb');
    bcEl.innerHTML = '';
    crumbs.forEach((c, idx) => {
      const sp = document.createElement('span');
      sp.className = 'crumb-link';
      sp.textContent = c.level === 0 ? 'Course' : c.title;
      sp.addEventListener('click', () => selectNode(c.id, true));
      bcEl.appendChild(sp);
      if (idx < crumbs.length - 1) {
        const sep = document.createElement('span');
        sep.textContent = '›';
        bcEl.appendChild(sep);
      }
    });

    document.getElementById('drawerTitle').textContent = n.title;
    document.getElementById('drawerTitle').style.color = n.level === 1 ? getColor(n) : '';
    document.getElementById('drawerSummary').textContent = n.summary;

    // Formula
    const fWrap = document.getElementById('drawerFormulaWrap');
    const fBox = document.getElementById('drawerFormula');
    if (n.formula) {
      fWrap.style.display = 'block';
      fBox.textContent = n.formula;
      fBox.style.borderLeftColor = getColor(n);
    } else {
      fWrap.style.display = 'none';
    }

    // Lectures (Title only, no dates!)
    const lecEl = document.getElementById('drawerLectures');
    lecEl.innerHTML = '';
    (n.lectures || []).forEach(lr => {
      const lec = lectureMap.get(lr.id);
      if (!lec) return;
      const card = document.createElement('div');
      card.className = 'lecture-card';
      card.title = 'Click to highlight all topics from this class';
      card.innerHTML = `
        <div class="lecture-card-top">
          <span class="lecture-badge">Class ${lec.number} (${lec.id})</span>
          <span class="role-pill ${lr.role}">${lr.role === 'primary' ? 'Primary' : 'Revisited'}</span>
        </div>
        <div class="lecture-title-text">${lec.title}</div>
      `;
      card.addEventListener('click', () => setLectureFilter(lec.id));
      lecEl.appendChild(card);
    });

    // Related Cross-Links
    const relWrap = document.getElementById('drawerRelatedWrap');
    const relEl = document.getElementById('drawerRelated');
    relEl.innerHTML = '';
    if (n.relatedIds && n.relatedIds.length) {
      relWrap.style.display = 'block';
      n.relatedIds.forEach(rid => {
        const rn = nodeMap.get(rid);
        if (!rn) return;
        const ch = document.createElement('span');
        ch.className = 'chip';
        ch.innerHTML = `<span class="legend-dot" style="background:${getColor(rn)}"></span>${rn.title}`;
        ch.addEventListener('click', () => selectNode(rid, true));
        relEl.appendChild(ch);
      });
    } else {
      relWrap.style.display = 'none';
    }

    // Subtopics (for L0/L1/L2)
    const chWrap = document.getElementById('drawerChildrenWrap');
    const chEl = document.getElementById('drawerChildren');
    chEl.innerHTML = '';
    const kids = childrenMap.get(id) || [];
    if (kids.length) {
      chWrap.style.display = 'block';
      kids.forEach(k => {
        const ch = document.createElement('span');
        ch.className = 'chip';
        ch.innerHTML = `<span class="legend-dot" style="background:${getColor(k)}"></span>${k.title}`;
        ch.addEventListener('click', () => selectNode(k.id, true));
        chEl.appendChild(ch);
      });
    } else {
      chWrap.style.display = 'none';
    }

    // Tags
    const tWrap = document.getElementById('drawerTagsWrap');
    const tEl = document.getElementById('drawerTags');
    tEl.innerHTML = '';
    if (n.tags && n.tags.length) {
      tWrap.style.display = 'block';
      n.tags.forEach(t => {
        const sp = document.createElement('span');
        sp.className = 'tag-pill';
        sp.textContent = t;
        tEl.appendChild(sp);
      });
    } else {
      tWrap.style.display = 'none';
    }

    drawer.classList.add('open');
    render();
    if (shouldCenter) centerOnNode(id);
  }

  function closeDrawer() {
    drawer.classList.remove('open');
    selectedId = null;
    selectedLinkKey = null;
    render();
  }

  function setLectureFilter(lecId) {
    activeLectureId = lecId || '';
    lectureFilter.value = activeLectureId;
    if (activeLectureId) {
      const lec = lectureMap.get(activeLectureId);
      collapsed.clear();
      syncDepthButtons();
      filterBannerText.textContent = `Highlighting ${lec.id}: ${lec.title}`;
      filterBanner.style.display = 'inline-flex';
    } else {
      filterBanner.style.display = 'none';
    }
    render();
    fitToScreen();
  }

  // Pan & Zoom
  let isDragging = false, dragStart = { x: 0, y: 0 };
  stage.addEventListener('mousedown', (e) => {
    if (e.target.closest('.node-group') || e.target.closest('.cross-group')) return;
    isDragging = true;
    stage.classList.add('dragging');
    dragStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    transform.x = e.clientX - dragStart.x;
    transform.y = e.clientY - dragStart.y;
    applyTransform();
  });
  window.addEventListener('mouseup', () => {
    isDragging = false;
    stage.classList.remove('dragging');
  });
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = stage.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    const nextK = Math.max(0.22, Math.min(2.6, transform.k * factor));
    const ratio = nextK / transform.k;
    transform.x = mx - (mx - transform.x) * ratio;
    transform.y = my - (my - transform.y) * ratio;
    transform.k = nextK;
    applyTransform();
  }, { passive: false });

  svg.addEventListener('click', (e) => {
    if (e.target === svg) closeDrawer();
  });

  // Search
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    searchClear.style.display = q ? 'block' : 'none';
    if (!q) { searchResults.style.display = 'none'; return; }
    const hits = DATA.nodes.filter(n =>
      n.title.toLowerCase().includes(q) ||
      n.summary.toLowerCase().includes(q) ||
      (n.formula && n.formula.toLowerCase().includes(q)) ||
      (n.tags && n.tags.some(t => t.toLowerCase().includes(q)))
    ).slice(0, 14);

    searchResults.innerHTML = '';
    if (!hits.length) {
      searchResults.innerHTML = `<div class="search-item"><span class="search-item-sub">No matching topics found.</span></div>`;
    } else {
      hits.forEach(h => {
        const div = document.createElement('div');
        div.className = 'search-item';
        div.innerHTML = `
          <div class="search-item-title">
            <span class="search-item-dot" style="background:${getColor(h)}"></span>
            <span>${h.title}</span>
          </div>
          <div class="search-item-sub">${h.summary}</div>
        `;
        div.addEventListener('click', () => {
          searchResults.style.display = 'none';
          selectNode(h.id, true);
        });
        searchResults.appendChild(div);
      });
    }
    searchResults.style.display = 'block';
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.style.display = 'none';
    searchResults.style.display = 'none';
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) searchResults.style.display = 'none';
  });

  // Toolbar buttons
  lectureFilter.addEventListener('change', () => setLectureFilter(lectureFilter.value));
  document.getElementById('filterBannerClear').addEventListener('click', () => setLectureFilter(''));
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);

  document.getElementById('btnLayoutTree').addEventListener('click', () => {
    layoutMode = 'tree';
    document.getElementById('btnLayoutTree').classList.add('active');
    document.getElementById('btnLayoutRadial').classList.remove('active');
    render(); fitToScreen();
  });
  document.getElementById('btnLayoutRadial').addEventListener('click', () => {
    layoutMode = 'radial';
    document.getElementById('btnLayoutRadial').classList.add('active');
    document.getElementById('btnLayoutTree').classList.remove('active');
    render(); fitToScreen();
  });

  btnExpandAll.addEventListener('click', () => {
    collapsed.clear(); syncDepthButtons(); render(); fitToScreen();
  });
  btnOverview.addEventListener('click', () => {
    collapsed.clear();
    DATA.nodes.filter(n => n.level === 2).forEach(n => collapsed.add(n.id));
    syncDepthButtons(); render(); fitToScreen();
  });
  document.getElementById('btnCrossLinks').addEventListener('click', (e) => {
    showAllCrossLinks = !showAllCrossLinks;
    e.currentTarget.classList.toggle('active', showAllCrossLinks);
    updateCrossLinkFocus();
  });

  document.getElementById('btnZoomIn').addEventListener('click', () => {
    const r = stage.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const nk = Math.min(2.6, transform.k * 1.2);
    transform.x = cx - (cx - transform.x) * (nk / transform.k);
    transform.y = cy - (cy - transform.y) * (nk / transform.k);
    transform.k = nk; applyTransform();
  });
  document.getElementById('btnZoomOut').addEventListener('click', () => {
    const r = stage.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const nk = Math.max(0.22, transform.k / 1.2);
    transform.x = cx - (cx - transform.x) * (nk / transform.k);
    transform.y = cy - (cy - transform.y) * (nk / transform.k);
    transform.k = nk; applyTransform();
  });
  document.getElementById('btnFit').addEventListener('click', fitToScreen);

  document.getElementById('btnTheme').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    render();
  });

  // Export SVG
  document.getElementById('btnExportSVG').addEventListener('click', () => {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    posMap.forEach(p => {
      minX = Math.min(minX, p.x - p.w / 2 - 40);
      maxX = Math.max(maxX, p.x + p.w / 2 + 40);
      minY = Math.min(minY, p.y - p.h / 2 - 40);
      maxY = Math.max(maxY, p.y + p.h / 2 + 40);
    });
    const clone = svg.cloneNode(true);
    clone.setAttribute('viewBox', `${minX} ${minY} ${maxX - minX} ${maxY - minY}`);
    clone.setAttribute('width', Math.round(maxX - minX));
    clone.setAttribute('height', Math.round(maxY - minY));
    clone.querySelector('#viewport').removeAttribute('transform');
    const bg = svgEl('rect', {
      x: minX, y: minY, width: maxX - minX, height: maxY - minY,
      fill: document.documentElement.getAttribute('data-theme') === 'dark' ? '#0f172a' : '#f8fafc'
    });
    clone.insertBefore(bg, clone.firstChild);
    const blob = new Blob([new XMLSerializer().serializeToString(clone)], { type: 'image/svg+xml;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'segnali_elettrofisiologici_mindmap.svg';
    a.click();
  });

  // Export Markdown Outline
  document.getElementById('btnExportMD').addEventListener('click', () => {
    const lines = [`# ${DATA.course}`, ''];
    DATA.pillars.forEach(p => {
      lines.push(`## ${p.title}`);
      (childrenMap.get(p.id) || []).forEach(c => {
        lines.push(`### ${c.title}`);
        (childrenMap.get(c.id) || []).forEach(leaf => {
          const lecs = (leaf.lectures || []).map(x => `${x.id}: ${lectureMap.get(x.id).title}`).join('; ');
          lines.push(`- **${leaf.title}** — ${leaf.summary} *(${lecs})*`);
        });
        lines.push('');
      });
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'segnali_elettrofisiologici_outline.md';
    a.click();
  });

  // Keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault(); searchInput.focus();
    } else if (e.key === 'Escape') {
      searchResults.style.display = 'none';
      if (document.activeElement === searchInput) searchInput.blur();
      else closeDrawer();
    }
  });

  // Initial render (Overview mode + Cross-Links visible)
  syncDepthButtons();
  render();
  fitToScreen();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Segnali elettrofisiologici — Interactive Mind Map</title>
<style>
  :root {
    --bg: #f8fafc;
    --bg-canvas: #f1f5f9;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #475569;
    --text-subtle: #64748b;
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
    --root-bg: #0f172a;
    --root-text: #ffffff;
    --grid-dot: #cbd5e1;
    --accent: #4f46e5;
  }
  [data-theme="dark"] {
    --bg: #0b1120;
    --bg-canvas: #0f172a;
    --surface: #1e293b;
    --surface-2: #0f172a;
    --border: #334155;
    --text: #f8fafc;
    --text-muted: #cbd5e1;
    --text-subtle: #94a3b8;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    --root-bg: #f8fafc;
    --root-text: #0f172a;
    --grid-dot: #1e293b;
    --accent: #818cf8;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
  }

  /* Top Toolbar */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 58px; z-index: 30;
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .brand {
    display: flex; flex-direction: column; margin-right: 6px; min-width: 195px;
  }
  .brand-title { font-weight: 750; font-size: 15px; letter-spacing: -0.01em; line-height: 1.15; }
  .brand-sub { font-size: 11px; color: var(--text-subtle); }

  .search-wrap { position: relative; flex: 1; max-width: 280px; }
  .search-input {
    width: 100%; height: 34px; padding: 0 28px 0 30px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 13px;
    outline: none; transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); background: var(--surface); }
  .search-icon {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    font-size: 13px; color: var(--text-subtle); pointer-events: none;
  }
  .search-clear {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    border: none; background: transparent; color: var(--text-subtle);
    cursor: pointer; font-size: 14px; display: none; padding: 2px 4px;
  }
  .search-results {
    position: absolute; top: 38px; left: 0; right: 0; max-height: 360px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); display: none; z-index: 50;
  }
  .search-item {
    padding: 8px 11px; cursor: pointer; border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 2px;
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover { background: var(--surface-2); }
  .search-item-title { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .search-item-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .search-item-sub { font-size: 11px; color: var(--text-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .lecture-select {
    height: 34px; max-width: 255px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 12.5px; padding: 0 8px;
    outline: none; cursor: pointer;
  }
  .lecture-select:focus { border-color: var(--accent); }

  .btn-group { display: flex; align-items: center; gap: 4px; }
  .btn {
    height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 12px; font-weight: 550;
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    white-space: nowrap; transition: all 0.15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }

  .spacer { flex: 1; }

  /* Canvas */
  #stage {
    position: fixed; top: 58px; left: 0; right: 0; bottom: 0;
    background-color: var(--bg-canvas);
    background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
    background-size: 22px 22px;
    cursor: grab; user-select: none; overflow: hidden;
  }
  #stage.dragging { cursor: grabbing; }
  svg#mindmap { width: 100%; height: 100%; display: block; }

  .edge { fill: none; stroke-linecap: round; transition: opacity 0.2s, stroke-width 0.2s; }

  /* Interactive Cross-Links */
  .cross-group { cursor: pointer; }
  .cross-hit { fill: none; stroke: transparent; stroke-width: 14px; cursor: pointer; }
  .cross-edge {
    fill: none; stroke-dasharray: 6 5; stroke-linecap: round;
    transition: opacity 0.18s, stroke-width 0.18s, stroke 0.18s;
    pointer-events: none;
  }
  .cross-group.highlighted .cross-edge,
  .cross-group:hover .cross-edge {
    stroke-opacity: 0.96 !important;
    stroke-width: 3px !important;
    stroke-dasharray: 8 4;
    animation: dashFlow 1.1s linear infinite;
  }
  .cross-group.dimmed .cross-edge { stroke-opacity: 0.08 !important; }
  .cross-badge { pointer-events: none; transition: opacity 0.18s, transform 0.18s; }
  @keyframes dashFlow {
    to { stroke-dashoffset: -24; }
  }

  .node-group { cursor: pointer; transition: opacity 0.2s; }
  .node-box { transition: filter 0.15s, stroke-width 0.15s; }
  .node-group:hover .node-box { filter: brightness(0.97) drop-shadow(0 3px 8px rgba(0,0,0,0.14)); }
  .node-group.selected .node-box { stroke-width: 2.8px !important; filter: drop-shadow(0 4px 12px rgba(79,70,229,0.34)); }
  .node-group.link-endpoint .node-box { stroke-width: 2.8px !important; filter: drop-shadow(0 0 10px rgba(79,70,229,0.45)); }
  .node-group.dimmed { opacity: 0.16; }
  .edge.dimmed { opacity: 0.08; }
  .node-label { font-family: inherit; pointer-events: none; }
  .toggle-btn { cursor: pointer; }

  /* Floating Tooltip for Interactive Links */
  .link-tooltip {
    position: fixed; z-index: 60; pointer-events: none; display: none;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; max-width: 310px;
    box-shadow: var(--shadow); font-size: 12px; line-height: 1.38;
  }
  .link-tooltip-title { font-weight: 700; margin-bottom: 3px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .link-tooltip-sub { font-size: 11px; color: var(--text-subtle); }

  /* Floating Zoom & Legend Controls */
  .floating-controls {
    position: fixed; left: 16px; bottom: 16px; z-index: 25;
    display: flex; flex-direction: column; gap: 8px;
  }
  .zoom-bar {
    display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border);
    padding: 4px 6px; border-radius: 10px; box-shadow: var(--shadow); width: fit-content;
  }
  .zoom-bar .btn { height: 30px; padding: 0 9px; border: none; background: transparent; }
  .zoom-bar .btn:hover { background: var(--surface-2); }
  .hint-text { font-size: 11px; color: var(--text-subtle); padding: 0 6px; border-left: 1px solid var(--border); }

  .pillar-legend {
    display: flex; flex-wrap: wrap; gap: 6px; max-width: 580px;
    background: var(--surface); border: 1px solid var(--border);
    padding: 7px 10px; border-radius: 10px; box-shadow: var(--shadow);
  }
  .legend-chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 550;
    color: var(--text-muted); cursor: pointer; padding: 2px 6px; border-radius: 6px;
    transition: background 0.15s;
  }
  .legend-chip:hover { background: var(--surface-2); color: var(--text); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  /* Inspector Side Drawer */
  .drawer {
    position: fixed; top: 72px; right: 16px; bottom: 16px; width: 380px; max-width: calc(100vw - 32px);
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); z-index: 28; display: flex; flex-direction: column;
    transform: translateX(420px); transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: hidden;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header {
    padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .drawer-breadcrumb {
    font-size: 11px; color: var(--text-subtle); margin-bottom: 5px;
    display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  }
  .crumb-link { cursor: pointer; text-decoration: underline; text-decoration-color: transparent; }
  .crumb-link:hover { color: var(--text); text-decoration-color: currentColor; }
  .drawer-title { font-size: 17px; font-weight: 750; line-height: 1.25; margin: 0; }
  .drawer-close {
    border: none; background: var(--surface-2); color: var(--text-muted);
    width: 28px; height: 28px; border-radius: 7px; cursor: pointer; font-size: 16px;
    flex-shrink: 0; display: grid; place-items: center;
  }
  .drawer-close:hover { color: var(--text); }

  .drawer-body { padding: 14px 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .drawer-summary { font-size: 13.5px; line-height: 1.55; color: var(--text); margin: 0; }

  .formula-box {
    background: var(--surface-2); border-left: 3px solid var(--accent);
    padding: 9px 11px; border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px; line-height: 1.45; color: var(--text); word-break: break-word;
  }
  .section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-subtle); margin-bottom: 6px;
  }
  .lecture-list, .pair-list { display: flex; flex-direction: column; gap: 6px; }
  .lecture-card, .pair-card {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); cursor: pointer; transition: border-color 0.15s;
    display: flex; flex-direction: column; gap: 3px;
  }
  .lecture-card:hover, .pair-card:hover { border-color: var(--accent); }
  .lecture-card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .lecture-badge { font-size: 11px; font-weight: 700; color: var(--accent); }
  .role-pill {
    font-size: 10px; padding: 1px 6px; border-radius: 999px; font-weight: 600;
    background: rgba(79,70,229,0.12); color: var(--accent);
  }
  .role-pill.revisited { background: rgba(100,116,139,0.16); color: var(--text-subtle); }
  .lecture-title-text { font-size: 12.5px; font-weight: 550; line-height: 1.3; }

  .pair-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; font-weight: 600; }
  .pair-btn {
    border: none; background: transparent; padding: 0; color: var(--text); font: inherit;
    cursor: pointer; text-decoration: underline; text-decoration-color: rgba(100,116,139,0.35);
    display: inline-flex; align-items: center; gap: 4px; text-align: left;
  }
  .pair-btn:hover { color: var(--accent); text-decoration-color: var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11.5px; padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--accent); transform: translateY(-1px); }
  .tag-pill {
    font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border);
  }

  .filter-banner {
    position: fixed; top: 68px; left: 50%; transform: translateX(-50%); z-index: 26;
    background: var(--accent); color: #ffffff; padding: 6px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600; display: none; align-items: center; gap: 8px;
    box-shadow: var(--shadow);
  }
  .filter-banner button {
    border: none; background: rgba(255,255,255,0.22); color: #fff;
    border-radius: 999px; padding: 2px 8px; cursor: pointer; font-size: 11px; font-weight: 600;
  }

  @media (max-width: 960px) {
    .brand { display: none; }
    .pillar-legend, .hint-text { display: none; }
    .lecture-select { max-width: 150px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-title" id="courseTitle">Segnali elettrofisiologici</span>
    <span class="brand-sub" id="courseStats">16 classes · Interactive Mind Map</span>
  </div>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="searchInput" class="search-input" type="text" placeholder="Search concepts, equations... (/)" autocomplete="off" />
    <button id="searchClear" class="search-clear" title="Clear">×</button>
    <div id="searchResults" class="search-results"></div>
  </div>

  <select id="lectureFilter" class="lecture-select" title="Highlight topics by class title">
    <option value="">All 16 Classes (No Filter)</option>
  </select>

  <div class="btn-group">
    <button id="btnLayoutTree" class="btn active" title="Bilateral horizontal mind map">Mind Map</button>
    <button id="btnLayoutRadial" class="btn" title="360° radial mind map">Radial</button>
  </div>

  <div class="btn-group">
    <button id="btnOverview" class="btn active" title="Show pillars & topic clusters">Overview</button>
    <button id="btnExpandAll" class="btn" title="Expand all individual concepts">Expand All</button>
    <button id="btnCrossLinks" class="btn active" title="Show/hide interactive conceptual cross-links">Cross-Links</button>
  </div>

  <div class="spacer"></div>

  <div class="btn-group">
    <button id="btnExportSVG" class="btn" title="Download vector SVG">SVG</button>
    <button id="btnExportMD" class="btn" title="Download Markdown outline">MD</button>
    <button id="btnTheme" class="btn" title="Toggle light/dark mode">◐</button>
  </div>
</header>

<div id="filterBanner" class="filter-banner">
  <span id="filterBannerText"></span>
  <button id="filterBannerClear">Clear</button>
</div>

<div id="linkTooltip" class="link-tooltip"></div>

<main id="stage">
  <svg id="mindmap" xmlns="http://www.w3.org/2000/svg">
    <g id="viewport">
      <g id="layer-edges"></g>
      <g id="layer-cross"></g>
      <g id="layer-nodes"></g>
    </g>
  </svg>
</main>

<div class="floating-controls">
  <div class="zoom-bar">
    <button id="btnZoomIn" class="btn" title="Zoom in">+</button>
    <button id="btnZoomOut" class="btn" title="Zoom out">−</button>
    <button id="btnFit" class="btn" title="Fit mind map to screen">Fit</button>
    <span class="hint-text">Click nodes or dashed cross-links · Double-click clusters to expand</span>
  </div>
  <div id="pillarLegend" class="pillar-legend"></div>
</div>

<aside id="drawer" class="drawer" aria-label="Topic details">
  <div class="drawer-header">
    <div>
      <div id="drawerBreadcrumb" class="drawer-breadcrumb"></div>
      <h2 id="drawerTitle" class="drawer-title"></h2>
    </div>
    <button id="drawerClose" class="drawer-close" title="Close (Esc)">×</button>
  </div>
  <div class="drawer-body">
    <p id="drawerSummary" class="drawer-summary"></p>
    <div id="drawerFormulaWrap" style="display:none;">
      <div class="section-label">Key Relation / Example</div>
      <div id="drawerFormula" class="formula-box"></div>
    </div>
    <div id="drawerPairsWrap" style="display:none;">
      <div class="section-label">Connected Concept Pairs</div>
      <div id="drawerPairs" class="pair-list"></div>
    </div>
    <div id="drawerLecturesWrap">
      <div class="section-label">Discussed In</div>
      <div id="drawerLectures" class="lecture-list"></div>
    </div>
    <div id="drawerRelatedWrap" style="display:none;">
      <div class="section-label">Related Topics (Cross-Links)</div>
      <div id="drawerRelated" class="chips"></div>
    </div>
    <div id="drawerChildrenWrap" style="display:none;">
      <div class="section-label">Subtopics (Click to Inspect)</div>
      <div id="drawerChildren" class="chips"></div>
    </div>
    <div id="drawerTagsWrap" style="display:none;">
      <div class="section-label">Categories</div>
      <div id="drawerTags" class="chips"></div>
    </div>
  </div>
</aside>

<script>

: ["application", "analysis"], "relatedIds": ["n_stdp", "n_neuron_dnn"]}, {"id": "c2_1", "title": "Mathematical & Physical Prerequisites", "level": 2, "pillar": "p2", "parentId": "p2", "summary": "Essential calculus, linear ODEs, molarity, Coulomb electrostatics, dielectric permittivity, scalar potentials, and overdamped viscous ionic mobility.", "lectures": [{"id": "L3", "role": "primary"}, {"id": "L1", "role": "revisited"}], "formula": "", "tags": ["math/physics", "biophysics"], "relatedIds": []}, {"id": "c2_2", "title": "Electrodiffusion & Nernst-Planck Transport", "level": 2, "pillar": "p2", "parentId": "p2", "summary": "Derivation of drift and diffusive fluxes from Teorell's formula, thermal Brownian motion, chemical potential, Fick's First Law, and the combined Nernst-Planck equation.", "lectures": [{"id": "L4", "role": "primary"}, {"id": "L5", "role": "revisited"}], "formula": "", "tags": ["model/equation", "biophysics", "math/physics"], "relatedIds": []}, {"id": "c2_3", "title": "Membrane Capacitor & Recording Electrodes", "level": 2, "pillar": "p2", "parentId": "p2", "summary": "Aqueous electrochemistry, Helmholtz double layer vs. reversible Ag/AgCl micropipettes, phospholipid bilayer capacitance, and minimal charge separation.", "lectures": [{"id": "L4", "role": "primary"}, {"id": "L5", "role": "revisited"}], "formula": "", "tags": ["biophysics", "experiment/tool"], "relatedIds": []}, {"id": "c2_4", "title": "Ionic Gradients, Nernst & GHK Equations", "level": 2, "pillar": "p2", "parentId": "p2", "summary": "Asymmetric ion concentrations, passive channels vs. ATP pumps, Nernst equilibrium potential, Ohmic vs. Goldman flux laws, and multi-ion resting potential.", "lectures": [{"id": "L5", "role": "primary"}, {"id": "L4", "role": "revisited"}, {"id": "L6", "role": "revisited"}], "formula": "", "tags": ["model/equation", "biophysics"], "relatedIds": []}, {"id": "n_elem_calc", "title": "Elementary Functions & Essential Calculus", "level": 3, "pillar": "p2", "parentId": "c2_1", "summary": "Qualitative behavior of 1/r, 1−exp(−αt), ln(x), and lines, together with the chain rule d/dx[ln c(x)] = (1/c)(dc/dx) and definite integrals of 1/x used in Fick and Nernst derivations.", "lectures": [{"id": "L3", "role": "primary"}, {"id": "L4", "role": "revisited"}], "formula": "d/dx[ln c(x)] = (1/c)·dc/dx ;  ∫(1/x)dx = ln(b/a)", "tags": ["math/physics"], "relatedIds": ["n_fick_einstein", "n_nernst_eq"]}, {"id": "n_taylor_lin", "title": "First-Order Taylor Series Linearization", "level": 3, "pillar": "p2", "parentId": "c2_1", "summary": "Local linear approximation of smooth nonlinear laws around an operating point, used to linearize GHK flux into Ohmic law and evaluate Euler step accuracy.", "lectures": [{"id": "L3", "role": "primary"}, {"id": "L5", "role": "revisited"}, {"id": "L6", "role": "revisited"}], "formula": "f(x₀ + h) ≈ f(x₀) + f'(x₀)·h", "tags": ["math/physics", "model/equation"], "relatedIds": ["n_ohmic_vs_ghk", "n_first_order_ode"]}, {"id": "n_first_order_ode", "title": "First-Order Linear ODEs & Forward Euler", "level": 3, "pillar": "p2", "parentId": "c2_1", "summary": "The course's signature differential equation (df/dt = −af + b) has a dissipative exponential homogeneous solution plus steady-state particular solution, solved numerically via Forward Euler when nonlinear.", "lectures": [{"id": "L1", "role": "primary"}, {"id": "L3", "role": "primary"}, {"id": "L6", "role": "revisited"}, {"id": "L8", "role": "revisited"}], "formula": "df/dt = −af + b  ⇒  f(t) = K·e^(−at) + b/a", "tags": ["math/physics", "model/equation"], "relatedIds": ["n_rc_step", "n_stokes_drag", "n_gating_ode", "n_taylor_lin"]}, {"id": "n_molarity_avogadro", "title": "Number Density vs. Molarity (Avogadro)", "level": 3, "pillar": "p2", "parentId": "c2_1", "summary": "Links particle density ρ to chemical molarity C via Avogadro's number N_A ≈ 6×10²³ mol⁻¹, enabling back-of-the-envelope counts of bulk ions inside a neuron.", "lectures": [{"id": "L3", "role": "primary"}, {"id": "L4", "role": "revisited"}], "formula": "ρ = N_A · C  (1 mM ≈ 6×10¹⁷ ions/cm³)", "tags": ["math/physics", "biophysics"], "relatedIds": ["n_faraday_current", "n_minimal_charge"]}, {"id": "n_coulomb_perm", "title": "Coulomb's Law, Permittivity & Quantization", "level": 3, "pillar": "p2", "parentId": "c2_1", "summary": "Electrostatic forces are ~10³⁹× stronger than gravity and act on quantized ionic charges (z·e); water's high relative permittivity (ε_r ≈ 80) weakens attraction 80-fold to enable salt dissociation.", "lectures": [{"id": "L3", "role": "primary"}, {"id": "L4", "role": "revisited"}], "formula": "F_e = (1 / 4πε₀ε_r) · (q₁q₂ / r²) ;  e = 1.6×10⁻¹⁹ C", "tags": ["math/physics", "biophysics"], "relatedIds": ["n_mem_capacitor", "n_debye_volcond"]}, {"id": "n_scalar_pot", "title": "Conservative Fields, Scalar Potential & Superposition", "level": 3, "pillar": "p2", "parentId": "c2_1", "summary": "Normalizing force by charge defines electric field E = −∇V, reducing vector problems to scalar potential sums defined up to an arbitrary reference (V_ext = 0).", "lectures": [{"id": "L3", "role": "primary"}, {"id": "L4", "role": "revisited"}, {"id": "L5", "role": "revisited"}], "formula": "E = −dV/dx ;  V = (1 / 4πε₀ε_r) Σ qᵢ/rᵢ", "tags": ["math/physics", "model/equation"], "relatedIds": ["n_drift_flux", "n_point_source_vc"]}, {"id": "n_stokes_drag", "title": "Stokes Viscous Drag & Ionic Mobility", "level": 3, "pillar": "p2", "parentId": "c2_1", "summary": "In water, viscous drag (−λv) damps ion inertia within picoseconds/nanoseconds, leaving terminal velocity instantaneously proportional to applied force (absolute mobility u = 1/λ; electrical mobility û = |z|eu).", "lectures": [{"id": "L3", "role": "primary"}, {"id": "L4", "role": "revisited"}, {"id": "L15", "role": "revisited"}], "formula": "v_ss = u · F_ext  (u = 1/λ) ;  û = |z|·e·u", "tags": ["math/physics", "biophysics", "model/equation"], "relatedIds": ["n_teorell_flux", "n_debye_volcond", "n_first_order_ode"]}, {"id": "n_teorell_flux", "title": "Particle Flux & Teorell's Formula", "level": 3, "pillar": "p2", "parentId": "c2_2", "summary": "1D molar flux J (moles crossing unit area per unit time) equals concentration times velocity; substituting overdamped mobility yields Teorell's transport law.", "lectures": [{"id": "L4", "role": "primary"}], "formula": "J = c · v = u · c · F_ext", "tags": ["model/equation", "math/physics", "biophysics"], "relatedIds": ["n_stokes_drag", "n_drift_flux", "n_fick_einstein"]}, {"id": "n_faraday_current", "title": "Electric Current Density & Faraday's Constant", "level": 3, "pillar": "p2", "parentId": "c2_2", "summary": "Molar ionic flux converts into electric current density via ion valence z and Faraday's constant F = N_A·e, the total charge of one mole of monovalent ions.", "lectures": [{"id": "L4", "role": "primary"}, {"id": "L5", "role": "revisited"}], "formula": "I_density = z · F · J_molar ;  F = N_A · e", "tags": ["math/physics", "biophysics"], "relatedIds": ["n_molarity_avogadro", "n_drift_flux"]}, {"id": "n_drift_flux", "title": "Electrostatic Drift Flux", "level": 3, "pillar": "p2", "parentId": "c2_2", "summary": "Applying Teorell's formula to the molar electrostatic force −zF(dV/dx) gives the wet-electrochemical drift flux driving cations down and anions up potential gradients.", "lectures": [{"id": "L4", "role": "primary"}, {"id": "L5", "role": "revisited"}], "formula": "J_drift = −u · c · z · F · (dV/dx)", "tags": ["model/equation", "biophysics"], "relatedIds": ["n_nernst_planck", "n_scalar_pot", "n_teorell_flux", "n_faraday_current"]}, {"id": "n_brownian_mc", "title": "Brownian Motion & Langevin Monte Carlo", "level": 3, "pillar": "p2", "parentId": "c2_2", "summary": "Diffusion emerges microscopically from isotropic thermal collisions ('drunk sailor' random walk), simulated via a 2D stochastic Langevin equation with reflecting walls.", "lectures": [{"id": "L4", "role": "primary"}], "formula": "m(dv/dt) = −λv + F_stochastic", "tags": ["biophysics", "model/equation", "experiment/tool"], "relatedIds": ["n_fick_einstein", "n_markov_indep"]}, {"id": "n_fick_einstein", "title": "Chemical Potential, Fick's Law & Einstein Relation", "level": 3, "pillar": "p2", "parentId": "c2_2", "summary": "Treating diffusion as a chemical-potential force (−RT d(ln c)/dx) inside Teorell's formula cancels c via the chain rule, yielding Fick's First Law and Einstein's relation D = uRT.", "lectures": [{"id": "L4", "role": "primary"}, {"id": "L5", "role": "revisited"}], "formula": "J_diff = −D (dc/dx) ,  with  D = u · R · T", "tags": ["model/equation", "biophysics", "history"], "relatedIds": ["n_elem_calc", "n_nernst_planck", "n_teorell_flux", "n_brownian_mc"]}, {"id": "n_nernst_planck", "title": "Combined Nernst-Planck Electrodiffusion", "level": 3, "pillar": "p2", "parentId": "c2_2", "summary": "Summing electrical drift and chemical diffusion yields total electrodiffusive flux; setting J_tot = 0 defines single-ion thermodynamic equilibrium where mobility u cancels.", "lectures": [{"id": "L4", "role": "primary"}, {"id": "L5", "role": "primary"}], "formula": "J_tot = −u·c·z·F·(dV/dx) − u·R·T·(dc/dx)", "tags": ["model/equation", "biophysics"], "relatedIds": ["n_nernst_eq", "n_ohmic_vs_ghk", "n_drift_flux", "n_fick_einstein"]}, {"id": "n_electroneutrality", "title": "Electrolytes & Local vs. Global Electroneutrality", "level": 3, "pillar": "p2", "parentId": "c2_3", "summary": "Cells are aqueous multi-ion electrolytes with mobile cations/anions and fixed intracellular anions; bulk solutions remain electroneutral while tiny local charge separation at the membrane creates −70 mV.", "lectures": [{"id": "L4", "role": "primary"}], "formula": "", "tags": ["biophysics", "math/physics"], "relatedIds": ["n_minimal_charge", "n_two_comp_ext"]}, {"id": "n_helmholtz", "title": "Metal-Electrolyte Interface & Helmholtz Layer", "level": 3, "pillar": "p2", "parentId": "c2_3", "summary": "A bare metal wire dipped in saline cannot directly exchange electrons with ions, forming a capacitive Helmholtz double layer (I = C dV/dt) that blocks steady DC resting potentials.", "lectures": [{"id": "L4", "role": "primary"}, {"id": "L12", "role": "revisited"}], "formula": "I_interface = C_Helmholtz · (dV/dt)  (= 0 at DC)", "tags": ["biophysics", "experiment/tool"], "relatedIds": ["n_ag_agcl", "n_multiscale_mod"]}, {"id": "n_ag_agcl", "title": "Reversible Ag/AgCl Electrodes & Micropipettes", "level": 3, "pillar": "p2", "parentId": "c2_3", "summary": "Chlorided silver wires (Ag + Cl⁻ ⇌ AgCl + e⁻) act as ohmic 'currency exchangers' between electronic and ionic currents, paired with pulled ~1 µm borosilicate glass micropipettes and V_ext = 0 reference.", "lectures": [{"id": "L4", "role": "primary"}, {"id": "L3", "role": "revisited"}, {"id": "L5", "role": "revisited"}], "formula": "Ag + Cl⁻ ⇌ AgCl + e⁻ ;  V_m = V_in − V_ext", "tags": ["experiment/tool", "biophysics"], "relatedIds": ["n_helmholtz", "n_patch_clamp"]}, {"id": "n_fluid_mosaic", "title": "Phospholipid Bilayer & Fluid Mosaic Model", "level": 3, "pillar": "p2", "parentId": "c2_3", "summary": "Amphipathic phospholipids self-assemble into an insulating bilayer separating intra- and extracellular electrolytes, hosting laterally mobile transmembrane proteins (ion channels, receptors, pumps).", "lectures": [{"id": "L4", "role": "primary"}, {"id": "L9", "role": "revisited"}], "formula": "", "tags": ["biophysics"], "relatedIds": ["n_mem_capacitor", "n_ion_channels"]}, {"id": "n_mem_capacitor", "title": "Parallel-Plate Membrane Capacitor", "level": 3, "pillar": "p2", "parentId": "c2_3", "summary": "Modeling the ~6 nm lipid bilayer (ε_r ≈ 7) as a parallel-plate capacitor explains the universal specific capacitance c_m ≈ 1 µF/cm² (and how membrane thickness was inferred before electron microscopy).", "lectures": [{"id": "L4", "role": "primary"}, {"id": "L5", "role": "primary"}, {"id": "L3", "role": "revisited"}, {"id": "L13", "role": "revisited"}], "formula": "C/A = ε₀ε_r / d ≈ 1 µF/cm² ;  I_C = C·(dV/dt)", "tags": ["biophysics", "model/equation", "experiment/tool"], "relatedIds": ["n_specific_cable", "n_minimal_charge", "n_coulomb_perm", "n_fluid_mosaic"]}, {"id": "n_minimal_charge", "title": "Minimal Charge Separation for −70 mV & Spikes", "level": 3, "pillar": "p2", "parentId": "c2_3", "summary": "By ΔQ = CΔV, establishing −70 mV or firing a 100 mV spike displaces only a minuscule fraction (~10⁶ ions) of a cell's ~50 billion bulk ions, allowing hundreds of spikes without depleting batteries.", "lectures": [{"id": "L4", "role": "primary"}, {"id": "L6", "role": "primary"}], "formula": "ΔQ/A = c_m · ΔV ≈ 7×10⁻⁸ C/cm²", "tags": ["biophysics", "math/physics"], "relatedIds": ["n_charge_budget", "n_molarity_avogadro", "n_electroneutrality", "n_mem_capacitor"]}, {"id": "n_life_death_rest", "title": "Resting State: Dynamic Steady State vs. Equilibrium", "level": 3, "pillar": "p2", "parentId": "c2_4", "summary": "A living neuron at −70 mV is not at thermodynamic equilibrium (which is cell death with all fluxes zero), but at a dynamic steady state where non-zero ionic currents sum to zero (ΣI_k = 0).", "lectures": [{"id": "L3", "role": "primary"}, {"id": "L5", "role": "primary"}], "formula": "Σ I_k = 0  with  I_k ≠ 0  (maintained by ATP pumps)", "tags": ["biophysics", "math/physics"], "relatedIds": ["n_nak_pump", "n_ghk_voltage", "n_excitable_cells"]}, {"id": "n_ion_asym", "title": "Asymmetric Ion Concentrations (Squid Giant Axon)", "level": 3, "pillar": "p2", "parentId": "c2_4", "summary": "Extracellular fluid mirrors primordial seawater (high Na⁺, Cl⁻) while cytoplasm is rich in K⁺ and virtually devoid of free Ca²⁺ (nM–µM) so tiny Ca²⁺ influxes serve as potent second-messenger triggers.", "lectures": [{"id": "L4", "role": "primary"}, {"id": "L5", "role": "primary"}], "formula": "E_K ≈ −77 mV, E_Cl ≈ −69 mV, E_Na ≈ +55 mV, E_Ca ≈ +120 mV", "tags": ["biophysics", "history"], "relatedIds": ["n_nernst_eq", "n_vesicle_ ac_firing", "n_dend_spines", "n_ionotropic_meta", "n_ltp_substrates"]}, {"id": "n_gabab_model", "title": "Multi-Step Metabotropic (GABA_B) Kinetic Model", "level": 3, "pillar": "p4", "parentId": "c4_2", "summary": "Coupling receptor binding/desensitization, G-protein activation, and cooperative K⁺-channel opening yields 6 coupled 1st-order ODEs that naturally explain GABA_B's slow latency and 100–200 ms inertia.", "lectures": [{"id": "L11", "role": "primary"}, {"id": "L10", "role": "revisited"}], "formula": "", "tags": ["model/equation", "biophysics"], "relatedIds": ["n_ionotropic_meta"]}, {"id": "n_dirac_syn", "title": "Dirac-Delta Synapse & Frequency-to-Amplitude Conversion", "level": 3, "pillar": "p4", "parentId": "c4_2", "summary": "Modeling spike trains as Dirac deltas T_max Σδ(t−t_k) yields exponential impulse responses whose steady-state peak scales linearly with firing rate—making synapses frequency-to-amplitude converters.", "lectures": [{"id": "L11", "role": "primary"}], "formula": "dO/dt = −βO + αT_max Σδ(t−t_k)  ⇒  O_peak ∝ f · αT_max / β", "tags": ["model/equation", "math/physics"], "relatedIds": ["n_temp_integ", "n_fi_curve", "n_syn_2state"]}, {"id": "n_std_stf", "title": "Homosynaptic Short-Term Plasticity (STD vs. STF)", "level": 3, "pillar": "p4", "parentId": "c4_3", "summary": "Transient (hundreds of ms) presynaptic modulation: short-term depression (STD) stems from vesicle depletion/slow replenishment (τ_rec ~ 500–1000 ms), while facilitation (STF) stems from residual presynaptic Ca²⁺.", "lectures": [{"id": "L11", "role": "primary"}, {"id": "L10", "role": "revisited"}, {"id": "L12", "role": "revisited"}], "formula": "τ_rec ≈ 500–1000 ms", "tags": ["biophysics", "experiment/tool"], "relatedIds": ["n_tm_model", "n_ampa_desens", "n_vesicle_exo"]}, {"id": "n_target_spec", "title": "Target-Cell Specificity & Cortical E-I Stability", "level": 3, "pillar": "p4", "parentId": "c4_3", "summary": "Triple-patch experiments (Markram & Tsodyks) showed one pyram 2", "role": "revisited"}], "formula": "", "tags": ["analysis", "model/equation", "application"], "relatedIds": ["n_tm_model", "n_ltp_stp_inter"]}, {"id": "n_up_down_osc", "title": "Emergent Up/Down Oscillations & MEA Bursting", "level": 3, "pillar": "p4", "parentId": "c4_3", "summary": "Recurrent cortical excitation triggers population avalanches self-terminated by STD and adaptation, producing ~0.5–1 Hz slow-wave Up/Down states in vivo (mPFC) and synchronous bursts on 2D CMOS/glass MEAs.", "lectures": [{"id": "L12", "role": "primary"}, {"id": "L2", "role": "revisited"}], "formula": "", "tags": ["biophysics", "model/equation", "experiment/tool"], "relatedIds": ["n_tm_model", "n_channel_zoo", "n_buzsaki_rec", "n_target_spec"]}, {"id": "n_epilepsy_sync", "title": "Epilepsy as Runaway Synchronization & Seizures", "level": 3, "pillar": "p4", "parentId": "c4_3", "summary": "Frames seizures as unstable positive feedback and oscillator phase-locking (coupled metronomes), contrasting generalized tonic-clonic, focal motor, and thalamocortical spike-and-wave absence seizures.", "lectures": [{"id": "L2", "role": "primary"}, {"id": "L1", "role": "revisited"}, {"id": "L8", "role": "revisited"}, {"id": "L12", "role": "revisited"}, {"id": "L16", "role": "revisited"}], "formula": "", "tags": ["biophysics", "application", "analysis"], "relatedIds": ["n_hyperkalemia", "n_dbs_adbs", "n_epileptic_colab", "n_shannon_signal", "n_homunculus", "n_optogenetics", "n_gap_sync"]}, {"id": "n_ltp_substrates", "title": "Cellular & Structural Substrates of LTP/LTD", "level": 3, "pillar": "p4", "parentId": "c4_4", "summary": "Persistent synaptic strength changes arise from NMDA/Ca²⁺-driven postsynaptic receptor insertion (ḡ_syn), presynaptic release (U, T_max), phosphorylation (γ), unsilencing deaf/mute synapses, and spine growth.", "lectures": [{"id": "L12", "role": "primary"}], "formula": "", "tags": ["biophysics", "experiment/tool"], "relatedIds": ["n_dend_spines", "n_nmda_mg", "n_ltp_stp_inter", "n_ion_asym"]}, {"id": "n_hebb_ltp", "title": "Hebbian Learning & Hippocampal LTP (Bliss & Lømo)", "level": 3, "pillar": "p4", "parentId": "c4_4", "summary": "Donald Hebb's co-activation postulate ('fire together, wire together') was verified by Bliss & Lømo in hippocampal CA3–CA1 slices: 50–100 Hz tetani induce persistent NMDA-dependent LTP (blocked by AP5).", "lectures": [{"id": "L12", "role": "primary"}], "formula": "Δw_ij ∝ x_pre · x_post  (blocked by AP5)", "tags": ["history", "experiment/tool", "biophysics"], "relatedIds": ["n_nmda_mg", "n_stdp"]}, {"id": "n_stdp", "title": "Spike-Timing-Dependent Plasticity (STDP)", "level": 3, "pillar": "p4", "parentId": "c4_4", "summary": "Causal pre-before-post timing (Δt > 0, tens of ms) induces LTP while post-before-pre (Δt < 0) induces LTD (larger LTD area stabilizes recurrent networks), signaled to spines by backpropagating APs.", "lectures": [{"id": "L12", "role": "primary"}, {"id": "L14", "role": "revisited"}, {"id": "L16", "role": "revisited"}], "formula": "Δt = t_post − t_pre :  Δt > 0 ⇒ LTP ,  Δt < 0 ⇒ LTD", "tags": ["biophysics", "experiment/tool", "application"], "relatedIds": ["n_bap", "n_democ_stdp", "n_triplet_stdp", "n_neuromorphic", "n_dales_law", "n_hebb_ltp"]}, {"id": "n_triplet_stdp", "title": "Triplet STDP, Frequency & Cortical Motifs", "level": 3, "pillar": "p4", "parentId": "c4_4", "summary": "Multi-patch recordings (Sjöström) and triplet/voltage models (Pfister-Gerstner, Clopath) show low-frequency STDP eliminates bidirectional motifs (barrel cortex) whereas >35 Hz pairing sustains them (visual cortex).", "lectures": [{"id": "L12", "role": "primary"}], "formula": "Independent bidirectional null: p² = 0.01 vs. observed motifs", "tags": ["model/equation", "experiment/tool", "analysis"], "relatedIds": ["n_multipatch", "n_stdp"]}, {"id": "n_ltp_stp_inter", "title": "Interaction of LTP and STP (Buonomano)", "level": 3, "pillar": "p4", "parentId": "c4_4", "summary": "Postsynaptic LTP (↑ḡ_syn, hippocampus) uniformly scales all EPSPs preserving integrator filtering, whereas presynaptic LTP (↑U, cortex) boosts the 1st EPSP and deepens STD, creating a high-pass onset detector.", "lectures": [{"id": "L12", "role": "primary"}], "formula": "↑ḡ_syn ⇒ uniform scaling ;  ↑U ⇒ stronger 1st EPSP + deeper STD", "tags": ["biophysics", "analysis", "model/equation"], "relatedIds": ["n_tm_model", "n_syn_filter", "n_ltp_substrates"]}, {"id": "c5_1", "title": "Passive Cable Equation & Analytical Solutions", "level": 2, "pillar": "p5", "parentId": "p5", "summary": "Kelvin & Rall's distributed ladder network, specific parameters, cable PDE derivation, λ and τ_m, boundary conditions, and steady-state semi-infinite, finite, and doubly infinite solutions.", "lectures": [{"id": "L13", "role": "primary"}, {"id": "L12", "role": "revisited"}], "formula": "", "tags": ["model/equation", "math/physics", "biophysics"], "relatedIds": []}, {"id": "c5_2", "title": "AC Filtering, Transients & Geometry", "level": 2, "pillar": "p5", "parentId": "p5", "summary": "Crank-Nicolson and NEURON compartmental simulations, frequency-dependent λ_AC(ω) low-pass filtering, Gaussian transients, tapered asymmetry, functional subunits, and Rall's ball-and-stick.", "lectures": [{"id": "L14", "role": "primary"}, {"id": "L15", "role": "revisited"}], "formula": "", "tags": ["model/equation", "biophysics", "experiment/tool"], "relatedIds": []}, {"id": "c5_3", "title": "Active Dendrites & Single-Neuron Computation", "level": 2, "pillar": "p5", "parentId": "p5", "summary": "Backpropagating APs, BAC Ca²⁺ coincidence detection, hippocampal dendritic democracy and its clash with STDP, shunting summation, dendritic spines, and the single neuron as a deep network.", "lectures": [{"id": "L14", "role": "primary"}, {"id": "L15", "role": "revisited"}, {"id": "L16", "role": "revisited"}], "formula": "", "tags": ["biophysics", "model/equation", "experiment/tool"], "relatedIds": []}, {"id": "n_kelvin_rall", "title": "Origins of Cable Theory (Kelvin & Rall)", "level": 3, "pillar": "p5", "parentId": "c5_1", "summary": "Adapted by Wilfrid Rall from Lord Kelvin's submarine telegraph equation to resolve his debate with John Eccles, proving slow somatic EPSPs arise from electrotonic filtering of distal synapses.", "lectures": [{"id": "L13", "role": "primary"}, {"id": "L12", "role": "revisited"}, {"id": "L14", "role": "revisited"}], "formula": "", "tags": ["history", "biophysics"], "relatedIds": ["n_cable_transient", "n_rall_ball_stick"]}, {"id": "n_specific_cable", "title": "Specific Membrane & Axial Parameters", "level": 3, "pillar": "p5", "parentId": "c5_1", "summary": "Continuous spatial PDEs normalize electrical properties by area or length: specific capacitance c_m ≈ 1 µF/cm², membrane resistance r_m ≈ 20 kΩ·cm², and cytoplasmic axial resistivity r_i.", "lectures": [{"id": "L13", "role": "primary"}], "formula": "c_m ≈ 1 µF/cm², r_m ≈ 20 kΩ·cm² ;  τ_m = r_m·c_m", "tags": ["biophysics", "math/physics"], "relatedIds": ["n_mem_capacitor", "n_lambda_tau"]}, {"id": "n_cable_pde", "title": "1D Ladder Network & Passive Cable PDE", "level": 3, "pillar": "p5", "parentId": "c5_1", "summary": "Applying KCL, Ohm's law, and 2nd-order spatial Taylor expansion to a cylindrical RC ladder (isopotential exterior, zero inductance) yields the linear diffusion-type passive cable PDE.", "lectures": [{"id": "L13", "role": "primary"}], "formula": "λ² (∂²v / ∂x²) = v + τ_m (∂v / ∂t)", "tags": ["model/equation", "math/physics", "biophysics"], "relatedIds": ["n_lumped_patch", "n_lambda_tau", "n_ac_cable"]}, {"id": "n_lambda_tau", "title": "Space Constant (λ) & Time Constant (τ_m)", "level": 3, "pillar": "p5", "parentId": "c5_1", "summary": "Dimensional symmetry defines the steady-state decay length λ (scaling with √radius and √(r_m/r_i), ~1000 µm for a 2 µm dendrite) alongside area-independent τ_m = r_m c_m (~20–50 ms).", "lectures": [{"id": "L13", "role": "primary"}, {"id": "L14", "role": "revisited"}], "formula": "λ = √(a·r_m / 2r_i) ;  τ_m = r_m · c_m", "tags": ["model/equation", "biophysics", "math/physics"], "relatedIds": ["n_ac_cable", "n_taper_asym", "n_specific_cable", "n_cable_pde"]}, {"id": "n_cable_bc", "title": "Cable Boundary Conditions", "level": 3, "pillar": "p5", "parentId": "c5_1", "summary": "Unique cable solutions require an initial condition plus two spatial boundary conditions: sealed end (∂v/∂x = 0, von Neumann), killed end (v = 0, Dirichlet), terminated end, or voltage/current clamp.", "lectures": [{"id": "L13", "role": "primary"}], "formula": "Sealed: ∂v/∂x|_L = 0 ;  Killed: v(L) = 0", "tags": ["math/physics", "model/equation"], "relatedIds": ["n_semi_inf_cable", "n_finite_cable"]}, {"id": "n_semi_inf_cable", "title": "Semi-Infinite Cable & Input Resistance (R_∞)", "level": 3, "pillar": "p5", "parentId": "c5_1", "summary": "At DC steady state (∂v/∂t = 0), boundedness as x → ∞ selects pure exponential decay v(x) = R_∞ I₀ e^(−x/λ) (dropping to 36% at x = λ), creating 'anti-democratic' attenuation of distal synapses.", "lectures": [{"id": "L13", "role": "primary"}, {"id": "L14", "role": "revisited"}], "formula": "v(x) = R_∞ · I₀ · exp(−x/λ)", "tags": ["model/equation", "math/physics", "biophysics"], "relatedIds": ["n_dend_democracy", "n_finite_cable", "n_cable_bc"]}, {"id": "n_finite_cable", "title": "Finite (Hyperbolic) & Doubly Infinite Cables", "level": 3, "pillar": "p5", "parentId": "c5_1", "summary": "Finite sealed cables obey hyperbolic cosh/sinh decay (nearly isopotential for L ≪ λ; semi-infinite for L ≳ 2–3λ), while central Dirac injection into a doubly infinite cable splits current symmetrically (½ R_∞).", "lectures": [{"id": "L13", "role": "primary"}, {"id": "L14", "role": "revisited"}], "formula": "Finite: v(x) ∝ cosh((L−x)/λ)/sinh(L/λ) ;  Inf: ½ R_∞ I₀ e^(−|x|/λ)", "tags": ["model/equation", "math/physics"], "relatedIds": ["n_neuron_sim", "n_semi_inf_cable", "n_cable_bc"]}, {"id": "n_neuron_sim", "title": "Crank-Nicolson Solvers & NEURON Simulator", nput resistance), making voltage attenuation much steeper dendrite→soma than soma→dendrite.", "lectures": [{"id": "L14", "role": "primary"}], "formula": "", "tags": ["biophysics", "model/equation"], "relatedIds": ["n_lambda_tau", "n_dend_spines"]}, {"id": "n_syn_territories", "title": "Functional Subunits (Synaptic Territories)", "level": 3, "pillar": "p5", "parentId": "c5_2", "summary": "NEURON attenuation maps on digitized layer-5 pyramidal trees reveal minimal attenuation within sibling branches vs. steep attenuation toward the soma, partitioning dendrites into semi-independent subunits.", "lectures": [{"id": "L14", "role": "primary"}], "formula": "", "tags": ["biophysics", "model/equation"], "relatedIds": ["n_neuron_dnn", "n_modeldb_morph"]}, {"id": "n_rall_ball_stick", "title": "Rall's Equivalent Cylinder (Ball-and-Stick) & d^(3/2) Law", "level": 3, "pillar": "p5", "parentId": "c5_2", "summary": "A passive branched dendritic tree collapses exactly into a single soma plus equivalent cylinder ('ball-and-stick') for distal-to-soma attenuation when branch diameters satisfy Rall's 3/2-power law.", "lectures": [{"id": "L14", "role": "primary"}, {"id": "L15", "role": "revisited"}], "formula": "d_parent^(3/2) = Σ d_daughter,i^(3/2)", "tags": ["model/equation", "math/physics", "history"], "relatedIds": ["n_kelvin_rall", "n_spike_morph"]}, {"id": "n_modeldb_morph", "title": "Digitized 3D Morphologies & Open Science (ModelDB)", "level": 3, "pillar": "p5", "parentId": "c5_2", "summary": "Public repositories like ModelDB provide microscopically traced 3D pyramidal morphologies (thousands of coupled ODEs) for reproducible NEURON/LFPy simulations of distributed synapses and bAPs.", "lectures": [{"id": "L15", "role": "primary"}, {"id": "L14", "role": "revisited"}], "formula": "", "tags": ["experiment/tool", "application"], "relatedIds": ["n_neuron_sim", "n_golgi_cajal", "n_syn_territories"]}, {"id": "n_bap", "title": "Backpropagating Action Potentials (bAPs)", "level": 3, "pil
